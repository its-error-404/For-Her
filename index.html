<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a1d">
<title>For Vaishu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a quiet shelf of little night-sky letters, newest first. Same palette as each page. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
:root {
  --sky: #0c1230;
  --sky-deep: #070a1d;
  --moon: #f4ecd6;
  --haze: #9aa3d4;
  --dim: #5f6798;
  --ink: #03040c;
  --glow: #ffd88c;
  --line: rgba(154,163,212,.22);
  --display: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  --body: "Karla", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--sky-deep); color: var(--moon); min-height: 100%; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.6;
  background: radial-gradient(120% 80% at 50% 0%, var(--sky) 0%, var(--sky-deep) 70%) fixed, var(--sky-deep);
}
main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(64px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 32px;
}
.for-you { font-family: var(--display); font-style: italic; font-size: 24px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 60px); line-height: 1.02; margin: 0; text-wrap: balance; }
h1 em { color: var(--glow); }
.sub { margin: 0; color: var(--haze); max-width: 36ch; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--haze); }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
a.card {
  display: flex; align-items: center; gap: 16px; padding: 16px;
  border: 1px solid var(--line); border-radius: 16px;
  background: rgba(154,163,212,.06); color: inherit; text-decoration: none;
  transition: border-color .2s, transform .2s;
}
a.card:hover { border-color: var(--glow); transform: translateY(-1px); }
a.card:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
.dot { width: 44px; height: 44px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fffaea, #e6dabb); box-shadow: 0 0 24px rgba(255,216,140,.3); }
.card-text { display: flex; flex-direction: column; min-width: 0; }
.card-text b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; }
.card-text span { font-size: 14px; color: var(--haze); }
.arrow { margin-left: auto; color: var(--glow); font-size: 20px; }
footer { color: var(--dim); font-family: var(--display); font-style: italic; font-size: 18px; }
</style>
</head>
<body>
<main>
  <span class="for-you">For you Vaishu ❤️</span>
  <h1>Little things, <em>made for you.</em></h1>
  <p class="sub">A new one shows up here every so often. Open them whenever you get a minute.</p>
  <span class="label">So far</span>
  <ul id="pages">
    <!-- Add new pages at the top -->
    <li>
      <a class="card" href="./the-moon/">
        <span class="dot" aria-hidden="true"></span>
        <span class="card-text"><b>The Moon</b><span>1 Nov 2026 · same moon, two cities</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
  <footer>— the black cat</footer>
</main>
</body>
</html>
